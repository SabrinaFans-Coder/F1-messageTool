version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: f1-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: F1_message
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  backend:
    build: ./backend
    container_name: f1-backend
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/F1_message?serverTimezone=Asia/Shanghai
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: f1-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql-data:
